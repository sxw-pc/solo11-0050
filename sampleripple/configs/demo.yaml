version: 1
base_dir: ..
ledger:
  db_path: var/ledger.db
server:
  host: 127.0.0.1
  port: 8765
streams:
  - stream_id: clean-grid
    source: fixtures/samples/clean
    format: csv
    time_field: ts
    time_format: epoch_ms
    sequence_field: seq
    group_by: [site, line, sensor]
    nominal_period_ms: 60000
    jitter_tolerance_ms: 500
    gap_tolerance_ms: 1000
    missing_policy: strict
    disorder_window: 2
    duplicate_policy: report
    drift_tolerance_ms: 500
    period_drift_tolerance_ms: 200
    edge_tolerance_ms: 500

  - stream_id: drift-run
    source: fixtures/samples/drift/2024-06-02.csv
    format: csv
    time_field: ts
    time_format: epoch_ms
    sequence_field: seq
    group_by: [site, line, sensor]
    nominal_period_ms: 60000
    jitter_tolerance_ms: 500
    gap_tolerance_ms: 1000
    missing_policy: ignore
    disorder_window: 2
    duplicate_policy: report
    drift_tolerance_ms: 500
    period_drift_tolerance_ms: 200
    edge_tolerance_ms: 5000

  - stream_id: gap-run
